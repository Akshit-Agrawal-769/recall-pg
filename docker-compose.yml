# Local PostgreSQL 16 with pgvector for Recall.
# First start runs every db/*.sql file in name order (Docker's init hook).
# To rebuild from scratch: docker compose down -v && docker compose up -d
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: recall-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: recall
    ports:
      - "5432:5432"
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
      - ./:/work:ro                 # lets tests/run.sh run inside the container
      - recall-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d recall"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  recall-data:
